name: CI
on:
  push:
    branches: [main]
  pull_request:
  # REQUIRED by the merge queue: a queue entry is built on its own
  # `gh-readonly-queue/main/...` ref, which emits NEITHER `pull_request` NOR
  # `push`. Without this trigger the required `checks` context never reports on a
  # queued entry and every merge times out.
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: kattakath
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Formatting
        # THE FLAKE'S OWN formatter, not a second one named here. This step used
        # to be `nix run nixpkgs#nixfmt-rfc-style -- --check $(find ...)`, which
        # is a separate source of truth from `formatter` in flake.nix — and it
        # hid the fact that `nix fmt` itself was broken for this repo (nixfmt
        # 1.4.0 cannot take the directory `nix fmt` hands it). CI stayed green
        # on files a contributor could not format locally, then failed on the
        # one they forgot. `--ci` is treefmt's own fail-on-change mode.
        run: nix fmt -- --ci
      - name: Flake outputs well-formed
        run: nix flake show
      - name: Build CLIs + module eval check
        run: nix flake check -L
